name: Deploy Docsify Site

on:
  push:
    branches: [main]
    # Publishing a release tag rebuilds so the new version goes live and root
    # switches to it.
    tags: ['v*']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          # Always build from main's tooling (converter, theme, switcher), even
          # when triggered by a tag push — only per-version *content* is frozen.
          ref: main
          # Need full history + all tags so convert.js can rebuild every
          # tagged version from git (git worktree per tag).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies (if any)
        run: |
          cd outliyr-framework
          npm install

      - name: Run convert.js
        run: |
          cd outliyr-framework
          node scripts/convert.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: outliyr-framework/docsify
          force_orphan: true